<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library System Borrow Records</title>
  <link rel="stylesheet" href="/css/overdue.css" />
  <script defer type="module" src="/js/overdue.js"></script>
</head>
<body>
<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">📘</span>
        <h2>Library System</h2>
      </div>
      <nav class="nav">
        <a href="/api/users/admin/dashboard" ><i class="icon">🏠</i> Dashboard</a>
        <a href="/api/users/admin/usermanagement"><i class="icon">👥</i> Users Management</a>
        <a href="/api/users/admin/bookmanagement" ><i class="icon" >📚</i> Books Management</a>
        <a href="/api/users/admin/borrowedrecords" ><i class="icon">📖</i> Borrowed Records</a>
        <a href="/api/users/admin/overdue" class="active"><i class="icon">⚠️</i> Overdue Records</a>
      </nav>
      <button class="logout" id="logoutBtn"><i class="icon">↩️</i> Logout</button>
    </aside>



            <!-- Main content -->
<main class="main-content">
            <!-- Top bar -->
        <header class="topbar">
            <div class="admin-info">
                <span id="admin-name">Admin Name</span>
                <span class="admin-role">Admin</span>
            </div>
            <div class="topbar-right">
                <button id="theme-toggle" class="theme-toggle">🌙</button>
                <button id="menu-toggle" class="menu-toggle">☰</button>
            </div>

        </header>

        <!-- Stats section -->
        <div class="stats-cards">
          <div class="card">
            <div class="card-icon">🕰</div>
            <div>
              <h3>Total Overdue Books</h3>
              <p></p>
            </div>
          </div>
          </div>


<div class="table-container">

    <!-- Search filter -->
    <div style="margin-bottom:16px;">
      <input type="text" id="tableFilter" placeholder="Search by member name or book title..."
        style="width:100%;max-width:400px;padding:9px 14px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;background:var(--card-bg);color:var(--text);outline:none;">
    </div>

           <!-- Overdue table -->
        <table id="overdueTable" class="overdue">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Member</th>
                    <th>Book</th>
                    <th>Fine (₦)</th>
                    <th>Contact</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
        <button id="toggleRecords" class="toggle-btn">Show More</button>

</div>
</main>
</div>
</body>
</html>
